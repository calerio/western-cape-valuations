<!DOCTYPE html>
<!-- GENERATED-PAGE SHELL — read by extract/export_pages.py (extraction repo) via string.Template.
     Every static page under /m/, /d/, /guide/ AND their /af/ mirrors is rendered through this
     shell. Asset/nav hrefs are prefixed with the root placeholder ("../" for English pages,
     "../../" for /af/ pages). Placeholders: lang, root, alternates, en_url, af_url, en_cur,
     af_cur, nav_*, wordmark_*, footer_*, title, meta_description, canonical, og_title,
     og_description, jsonld, content (dollar-brace syntax). Do not add literal dollar signs
     outside real placeholders — string.Template scans comments too. -->
<html lang="${lang}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>${title}</title>
<meta name="description" content="${meta_description}" />
<link rel="canonical" href="${canonical}" />
${alternates}
<link rel="icon" href="${root}favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="${root}favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="${root}favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="${root}favicon-16x16.png" />
<link rel="apple-touch-icon" href="${root}apple-touch-icon.png" />
<link rel="manifest" href="${root}manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Western Cape Property Valuation Atlas" />
<meta property="og:title" content="${og_title}" />
<meta property="og:description" content="${og_description}" />
<meta property="og:url" content="${canonical}" />
<meta property="og:image" content="https://calerio.github.io/western-cape-valuations/assets/og-card.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="${og_title}" />
<meta name="twitter:description" content="${og_description}" />
<meta name="twitter:image" content="https://calerio.github.io/western-cape-valuations/assets/og-card.jpg" />
<script type="application/ld+json">
${jsonld}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="${root}assets/tokens.css" />
<style>
  /* Static-page layout in the Atlas idiom (tokens.css supplies every color). */
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 64px}

  /* top bar: wordmark + the same segmented switcher the Atlas and Satellite pages share */
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0 14px;
    border-bottom:1px solid var(--hairline);margin-bottom:26px}
  .wordmark{font-size:13px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
  .wordmark span{color:var(--ink2);font-weight:600}
  .viewseg{display:inline-flex;background:var(--bg3);border-radius:9px;padding:2px}
  .viewseg a{text-decoration:none;font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink2);
    padding:8px 15px;border-radius:7px;cursor:pointer;transition:color .15s ease-out}
  .viewseg a:hover{color:var(--ink)}
  .viewseg a[aria-current="page"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}

  .crumbs{font-size:12px;color:var(--label2);margin-bottom:18px}
  .crumbs a{color:inherit;text-decoration:none}
  .crumbs a:hover{color:var(--ink)}
  .kick{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;margin-bottom:10px}
  .intro{color:var(--ink2);max-width:64ch}
  .note{font-size:11.5px;line-height:1.6;color:var(--label2)}
  .caveat{font-size:11.5px;line-height:1.6;color:var(--label2);margin-top:14px;max-width:64ch}

  h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:38px 0 14px}
  .sub{font-size:12px;color:var(--label2);margin:-8px 0 14px}

  /* stat tiles — mirrors the Atlas panel's .statgrid/.stile */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .stile{background:var(--bg2);border:1px solid var(--hairline);border-radius:var(--r-ctl);padding:13px 14px}
  .stl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--label2);margin-bottom:6px}
  .stv{font-size:20px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stn{font-size:11px;color:var(--label2);margin-top:4px}

  /* hairline tables — mirrors the Atlas panel's hairRow */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--label2);font-weight:600;
    text-align:left;padding:0 10px 8px 0}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
  td{padding:11px 10px 11px 0;border-top:1px solid var(--sep)}
  td a{text-decoration:none}
  td a:hover{text-decoration:underline}
  .tablewrap{overflow-x:auto}

  /* property cards — mirrors the Atlas panel's propcard */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .propcard{background:var(--bg2);border:1px solid var(--hairline);border-radius:var(--r-card);
    box-shadow:var(--shadow-card);padding:18px 20px}
  .propcard .pk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .propcard .pa{font-weight:600;letter-spacing:-.01em;font-size:17px;line-height:1.15;margin-bottom:3px}
  .propcard .ps{font-size:12px;color:var(--label2);margin-bottom:10px}
  .propcard .pv{font-weight:800;letter-spacing:-.01em;font-size:22px;font-variant-numeric:tabular-nums}
  .propcard .pm{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:3px}

  .linkrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .btn{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:-.01em;
    padding:9px 16px;border-radius:var(--r-chip);background:var(--bg3);color:var(--ink)}
  .btn:hover{background:var(--hairline)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent);opacity:.9}

  .footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--sep);font-size:11.5px;
    line-height:1.7;color:var(--label2)}
  .footer a{color:inherit;text-decoration:underline;text-decoration-color:var(--sep)}
  @media (max-width:560px){ h1{font-size:25px} .top{flex-wrap:wrap} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="wordmark" href="${root}index.html">${wordmark_a} <span>${wordmark_b}</span></a>
    <div style="display:flex;align-items:center;gap:10px">
      <nav class="viewseg" aria-label="Map view">
        <a href="${root}index.html">${nav_explore}</a>
        <a href="${root}map.html">${nav_satellite}</a>
      </nav>
      <nav class="viewseg" aria-label="Language / Taal">
        <a href="${en_url}" data-lang="en" hreflang="en"${en_cur}>EN</a>
        <a href="${af_url}" data-lang="af" hreflang="af"${af_cur}>AF</a>
      </nav>
    </div>
  </div>
${content}
  <div class="footer">
    ${footer_line1}
    ${footer_line2}
    ${footer_line3}
    <a href="../m/index.html">${footer_all}</a> ·
    <a href="${root}index.html">${footer_atlas}</a> ·
    <a href="${root}map.html">${footer_map}</a> ·
    <a href="https://github.com/calerio/western-cape-valuations">GitHub</a>
  </div>
</div>
<script src="${root}assets/lang.js?v=2"></script>
</body>
</html>
