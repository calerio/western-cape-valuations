{"@context":"https://schema.org","@type":"WebPage",
 "name":"Satellite map — Western Cape property valuations",
 "url":"https://calerio.github.io/western-cape-valuations/map.html",
 "description":"Satellite map of the Western Cape with live cadastral parcels; click any erf to see its official municipal valuation.",
 "isPartOf":{"@type":"WebSite","name":"Western Cape Property Valuation Atlas","url":"https://calerio.github.io/western-cape-valuations/"}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<link href="assets/tokens.css?v=1" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--map-bg);color:var(--ink);
    font-family:var(--font-map);-webkit-font-smoothing:antialiased}
  #map{position:fixed;inset:0}

  /* floating platters over the full-bleed map (Apple Maps idiom) */
  .ovl{position:fixed;z-index:10}
  .platter{background:var(--platter-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--sep);border-radius:var(--r-panel);box-shadow:var(--shadow-platter)}
  #brand{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;max-width:70vw;padding:12px 16px 13px}
  #brandKick{font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--label2);
    text-transform:uppercase;margin-bottom:2px}
  #brandTitle{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
  /* iOS-style segmented view switcher — identical on Atlas and Satellite */
  #viewsegWrap{top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;padding:4px;border-radius:12px}
  .viewseg{display:inline-flex;background:var(--bg3);border-radius:9px;padding:2px}
  .viewseg a{text-decoration:none;font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink2);
    padding:8px 15px;border-radius:7px;cursor:pointer;transition:color .15s ease-out}
  .viewseg a:hover{color:var(--ink)}
  .viewseg a[aria-current="page"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  @media (max-width:640px){ .viewseg a{font-size:11.5px;padding:8px 12px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }

  /* ward-boundary toggle chip */
  #wardchip{top:calc(env(safe-area-inset-top,0px) + 86px);left:16px;
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    padding:9px 14px;font-size:12px;letter-spacing:-.01em;font-weight:600;color:var(--label2);
    transition:color .2s ease-out,border-color .2s ease-out}
  #wardchip:hover{border-color:var(--accent)}
  #wardchip .sw{width:16px;height:0;border-top:2px dashed var(--map-ward);opacity:.35}
  #wardchip.on{color:var(--ink)}
  #wardchip.on .sw{opacity:1}

  #mapfail{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:var(--bg);text-align:center;padding:24px}
  #mapfail[hidden]{display:none}
  #mapfail a{color:var(--accent);font-weight:600}

  /* zoom/loading hint chip */
  #maphint{bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:50%;transform:translateX(-50%);
    background:var(--platter-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--sep);color:var(--label2);border-radius:var(--r-pill);
    padding:8px 16px;font-size:12.5px;letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
  #maphint[hidden]{display:none}

  /* parcel valuation panel — floating platter; right rail on desktop, bottom sheet on phones */
  #ppanel{top:calc(env(safe-area-inset-top,0px) + 78px);right:16px;width:340px;max-width:calc(100vw - 32px);
    max-height:calc(100dvh - 140px);overflow:auto;padding:18px 20px 16px}
  #ppanel[hidden]{display:none}
  @media (max-width:640px){
    #ppanel{top:auto;right:8px;left:8px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
      max-height:55dvh;border-radius:var(--r-panel) var(--r-panel) 12px 12px}
  }
  #pclose{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;line-height:1;
    color:var(--label2);cursor:pointer;padding:4px}
  .pKick{font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--label2);text-transform:uppercase;
    margin:0 20px 4px 0}
  .pAddr{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2;color:var(--ink);margin-bottom:2px}
  .pVal{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:10px;
    font-variant-numeric:tabular-nums}
  .pSub{font-size:12px;color:var(--label2);margin-bottom:10px}
  .pRow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px solid var(--sep);font-size:13px}
  .pRow .k{color:var(--label2)}
  .pRow .v{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .pPick{cursor:pointer;border-radius:6px;transition:background .15s ease-out}
  .pPick:hover{background:rgba(10,132,255,.12)}
  .pNote{font-size:11px;line-height:1.55;color:var(--label3);margin-top:10px}
  .pNote a{color:var(--accent)}
  .pLink{font-size:12.5px;letter-spacing:-.01em;font-weight:600;color:var(--accent);
    cursor:pointer;margin-bottom:10px}

  /* tone MapLibre's controls to the dark platter language */
  .maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top,0px) + 56px)}   /* clear the view switcher */
  .maplibregl-ctrl-group{border-radius:var(--r-chip);overflow:hidden;box-shadow:var(--shadow-platter);
    background:var(--platter-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .maplibregl-ctrl button{background:transparent}
  .maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1) hue-rotate(180deg)}
  .maplibregl-ctrl-attrib.maplibregl-compact{background:var(--platter-bg);color:var(--label2);border-radius:var(--r-chip)}
  .maplibregl-ctrl-attrib a{color:var(--label2)}
</style>
</head>
<body>
  <div id="map"></div>

  <div id="viewsegWrap" class="ovl platter">
    <nav class="viewseg" aria-label="Map view">
      <a href="index.html">Explore</a>
      <a href="map.html" aria-current="page">Satellite</a>
    </nav>
  </div>
  <div id="brand" class="ovl platter">
    <div id="brandKick">Municipal valuations · Satellite</div>
    <div id="brandTitle">Western Cape</div>
  </div>
  <div id="wardchip" class="ovl platter on" role="switch" aria-checked="true" aria-label="Toggle ward boundaries" hidden>
    <span class="sw"></span>Wards
  </div>

  <div id="maphint" class="ovl" hidden></div>

  <aside id="ppanel" class="ovl platter" hidden aria-label="Property valuation">
    <button id="pclose" aria-label="Close">×</button>
    <div id="pbody"></div>
  </aside>

  <div id="mapfail" hidden>
    <div>
      <div style="font-size:20px;font-weight:600;color:var(--ink);margin-bottom:10px">The map couldn’t load.</div>
      <div style="font-size:14px;color:var(--label2)">View the <a href="index.html">Atlas</a> instead.</div>
    </div>
  </div>

  <script type="module" src="assets/map.js?v=7"></script>
</body>
</html>
