<!DOCTYPE html>
<!-- Hand-written (NOT generated — no data dependency). GitHub Pages serves this for any
     unknown path on the project site; python3 -m http.server won't (its own 404 differs). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found — Western Cape Property Valuation Atlas</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/tokens.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{max-width:440px;margin:20px;text-align:center}
  .kick{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--ink2);margin-bottom:22px}
  .linkrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a.btn{display:inline-block;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:-.01em;
    padding:9px 16px;border-radius:10px;background:var(--bg3);color:var(--ink)}
  a.btn.primary{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="card">
  <div class="kick">404</div>
  <h1 id="h">Page not found</h1>
  <p id="p">That address isn't on the roll. Try the atlas, browse the municipalities, or open the satellite map.</p>
  <div class="linkrow">
    <a class="btn primary" href="/western-cape-valuations/index.html" id="l1">Interactive atlas</a>
    <a class="btn" href="/western-cape-valuations/m/index.html" id="l2">All municipalities</a>
    <a class="btn" href="/western-cape-valuations/map.html" id="l3">Satellite map</a>
  </div>
</div>
<script>
// Bilingual 404 — inline (GitHub Pages serves this file at ANY unknown path, so it must not
// depend on relative asset URLs). Same language resolution as assets/lang.js.
(function () {
  var lang; try { lang = localStorage.getItem("wcv-lang"); } catch (e) {}
  if (lang !== "af" && lang !== "en")
    lang = ((navigator.language || "").toLowerCase().indexOf("af") === 0) ? "af" : "en";
  if (lang !== "af") return;
  document.documentElement.lang = "af";
  document.title = "Bladsy nie gevind nie — Wes-Kaapse Eiendomswaardasie-atlas";
  document.getElementById("h").textContent = "Bladsy nie gevind nie";
  document.getElementById("p").textContent = "Daardie adres is nie op die rol nie. Probeer die atlas, blaai deur die munisipaliteite, of maak die satellietkaart oop.";
  document.getElementById("l1").textContent = "Interaktiewe atlas";
  document.getElementById("l2").textContent = "Alle munisipaliteite";
  document.getElementById("l2").href = "/western-cape-valuations/af/m/index.html";
  document.getElementById("l3").textContent = "Satellietkaart";
})();
</script>
</body>
</html>
